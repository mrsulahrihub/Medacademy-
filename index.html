/* ================================
   TOPIC INFORMATION
================================ */

const topicAnswers = {

"heart": `
❤️ HEART

The heart is a muscular organ that pumps blood throughout the body.

Main functions:
• Pumps oxygenated blood to tissues
• Pumps deoxygenated blood to lungs
• Maintains circulation
• Helps maintain blood pressure

Four chambers:
• Right atrium
• Right ventricle
• Left atrium
• Left ventricle

Major valves:
• Tricuspid valve
• Pulmonary valve
• Mitral valve
• Aortic valve
`,

"kidney": `
🫘 KIDNEY

The kidneys are paired organs of the urinary system.

Main functions:
• Filter blood
• Remove metabolic waste
• Produce urine
• Maintain fluid balance
• Maintain electrolyte balance
• Help regulate blood pressure

Functional unit:
Nephron
`,

"brain": `
🧠 BRAIN

The brain is the main organ of the central nervous system.

Major parts:
• Cerebrum
• Cerebellum
• Brainstem
• Diencephalon

Functions include:
• Thinking
• Memory
• Sensation
• Movement
• Coordination
• Regulation of many body functions
`,

"liver": `
🫀 LIVER

The liver is a large metabolic organ.

Important functions:
• Metabolism of nutrients
• Detoxification
• Bile production
• Protein synthesis
• Glycogen storage
• Storage of vitamins and minerals
`,

"anatomy": `
🦴 ANATOMY

Anatomy is the study of the structure of the human body.

Major areas:
• Gross anatomy
• Microscopic anatomy
• Developmental anatomy
• Neuroanatomy
• Surface anatomy
`,

"physiology": `
🫀 PHYSIOLOGY

Physiology is the study of how the human body normally functions.

Major areas:
• Cardiovascular physiology
• Respiratory physiology
• Renal physiology
• Nervous system physiology
• Endocrine physiology
• Gastrointestinal physiology
`,

"pharmacology": `
💊 PHARMACOLOGY

Pharmacology is the study of drugs and their effects on living organisms.

Major concepts:
• Pharmacokinetics
• Pharmacodynamics
• Drug receptors
• Dose response
• Drug interactions
• Adverse drug reactions
`,

"pathology": `
🔬 PATHOLOGY

Pathology is the study of disease and the structural and functional changes caused by disease.

Major areas:
• Cell injury
• Inflammation
• Neoplasia
• Hemodynamic disorders
• Genetic disorders
`,

"microbiology": `
🦠 MICROBIOLOGY

Microbiology is the study of microorganisms.

Major groups:
• Bacteria
• Viruses
• Fungi
• Parasites

It is important for understanding infectious diseases and their diagnosis.
`,

"fever": `
🌡️ FEVER

Fever is an elevation of body temperature caused by an increase in the body's temperature set point.

Common causes:
• Infections
• Inflammatory conditions
• Some medications
• Other medical conditions

Management depends on the underlying cause.
`,

"diabetes": `
🩸 DIABETES

Diabetes mellitus is a group of disorders characterized by elevated blood glucose.

Major types:
• Type 1 diabetes
• Type 2 diabetes
• Gestational diabetes

Common symptoms:
• Increased thirst
• Frequent urination
• Increased hunger
• Fatigue
• Weight changes
`,

"hypertension": `
❤️ HYPERTENSION

Hypertension means persistently elevated blood pressure.

Long-term uncontrolled hypertension can affect:
• Heart
• Brain
• Kidneys
• Eyes
• Blood vessels

Lifestyle modification and appropriate medical management are important.
`,

"migraine": `
🧠 MIGRAINE

Migraine is a neurological disorder characterized by recurrent headache attacks.

Possible features:
• Pulsating headache
• Nausea
• Vomiting
• Sensitivity to light
• Sensitivity to sound

Some people experience an aura before the headache.
`,

"thrombosis": `
🩸 THROMBOSIS

Thrombosis is the formation of a blood clot within a blood vessel.

Important types:
• Arterial thrombosis
• Venous thrombosis

A thrombus can obstruct blood flow and may cause serious complications.
`,

"osteoporosis": `
🦴 OSTEOPOROSIS

Osteoporosis is a condition characterized by reduced bone strength and increased fracture risk.

Risk factors include:
• Increasing age
• Low bone mineral density
• Hormonal changes
• Low calcium or vitamin D
• Certain medications
`,

"ecg": `
❤️ ECG

ECG stands for Electrocardiogram.

It records the electrical activity of the heart.

An ECG can provide information about:
• Heart rate
• Rhythm
• Conduction
• Some abnormalities of the heart
`,

"stroke": `
🧠 STROKE

A stroke occurs when blood flow to part of the brain is interrupted or when a blood vessel in the brain bleeds.

Major types:
• Ischemic stroke
• Hemorrhagic stroke

Common warning signs include sudden:
• Weakness
• Facial drooping
• Speech difficulty
• Vision problems
• Loss of coordination
`,

"asthma": `
🫁 ASTHMA

Asthma is a chronic inflammatory disease of the airways characterized by variable respiratory symptoms and airflow limitation.

Common symptoms:
• Wheezing
• Cough
• Shortness of breath
• Chest tightness
`,

"anemia": `
🩸 ANEMIA

Anemia is a condition in which the blood has reduced oxygen-carrying capacity, commonly due to reduced hemoglobin.

Common causes:
• Iron deficiency
• Blood loss
• Vitamin deficiencies
• Chronic diseases
• Genetic disorders
`,

"cough": `
🫁 COUGH

Cough is a protective reflex that helps clear the airways.

Possible causes include:
• Respiratory infections
• Asthma
• Allergies
• Gastroesophageal reflux
• Smoking
`,

"kidney stones": `
🫘 KIDNEY STONES

Kidney stones are solid deposits that form within the urinary tract.

Common symptoms:
• Severe flank pain
• Pain radiating toward the groin
• Blood in urine
• Nausea or vomiting

Treatment depends on stone size, location and clinical condition.
`,

"uti": `
🦠 UTI

UTI stands for Urinary Tract Infection.

It can affect:
• Urethra
• Bladder
• Ureters
• Kidneys

Common symptoms:
• Burning during urination
• Frequent urination
• Urgency
• Lower abdominal discomfort
`,

"adrenergic drugs": `
💊 ADRENERGIC DRUGS

Adrenergic drugs act on receptors influenced by the sympathetic nervous system.

Important receptors:
• Alpha-1
• Alpha-2
• Beta-1
• Beta-2
• Beta-3

They can affect heart rate, blood vessels, bronchi and other organs.
`,

"adrenergic blockers": `
💊 ADRENERGIC BLOCKERS

Adrenergic blockers reduce the effects of adrenergic stimulation.

Examples of groups:
• Alpha blockers
• Beta blockers

Their effects depend on which receptor is blocked.
`,

"cholinergic drugs": `
💊 CHOLINERGIC DRUGS

Cholinergic drugs produce effects similar to acetylcholine or increase cholinergic activity.

They may affect:
• Heart
• Smooth muscle
• Glands
• Eye
• Gastrointestinal tract
`,

"drug receptors": `
🔬 DRUG RECEPTORS

Drug receptors are biological structures with which drugs interact to produce effects.

Common receptor families include:
• G-protein coupled receptors
• Ion channels
• Enzyme-linked receptors
• Intracellular receptors
`,

"drug interactions": `
⚕️ DRUG INTERACTIONS

A drug interaction occurs when one drug changes the effect of another drug or substance.

Interactions can be:
• Pharmacokinetic
• Pharmacodynamic

They may increase toxicity or reduce therapeutic effects.
`,

"adverse drug reactions": `
⚠️ ADVERSE DRUG REACTIONS

An adverse drug reaction is an unwanted and harmful response associated with a medicine used at normal doses.

Examples include:
• Allergic reactions
• Gastrointestinal effects
• Liver injury
• Kidney injury
• Central nervous system effects
`,

"autonomic nervous system": `
🧠 AUTONOMIC NERVOUS SYSTEM

The autonomic nervous system regulates involuntary body functions.

Main divisions:
• Sympathetic nervous system
• Parasympathetic nervous system

It influences:
• Heart
• Blood vessels
• Lungs
• Gastrointestinal tract
• Glands
`,

"inflammation": `
🔥 INFLAMMATION

Inflammation is a protective response of living tissue to injury or harmful stimuli.

Cardinal signs:
• Redness
• Heat
• Swelling
• Pain
• Loss of function

Inflammation can be acute or chronic.
`

};


/* ================================
   FIND TOPIC
================================ */

function findTopic(question){

    const q =
    question
    .toLowerCase()
    .replace(/[?.,!]/g," ");

    const keys =
    Object.keys(topicAnswers);

    for(const key of keys){

        if(q.includes(key)){
            return key;
        }

    }

    return null;

}


/* ================================
   AI RESPONSE
================================ */

function getAIReply(question){

    const topic =
    findTopic(question);


    /* Topic found */

    if(topic){

        return topicAnswers[topic];

    }


    /* Search partial topic */

    const found =
    topics.find(topic =>
        question
        .toLowerCase()
        .includes(
            topic.toLowerCase()
        )
    );


    if(found){

        const key =
        found.toLowerCase();

        if(topicAnswers[key]){

            return topicAnswers[key];

        }

        return `
📚 ${found}

This topic is available on MedAcademy.

Please open the topic page from the Topics section to study its complete notes.
`;

    }


    /* Greetings */

    const q =
    question.toLowerCase();


    if(
        q.includes("hello") ||
        q.includes("hi") ||
        q.includes("assalam")
    ){

        return `
👋 Hello!

I am MedAcademy AI.

I can answer questions related to the medical topics available on this website.

Try asking:

• What is heart?
• What is kidney?
• Explain pharmacology
• What is thrombosis?
• What is ECG?
• Explain hypertension
`;

    }


    /* Not available */

    return `
❌ Sorry!

I can only answer questions related to the topics currently available on the MedAcademy website.

Please ask about one of these topics:

❤️ Heart
🧠 Brain
🫘 Kidney
🫀 Liver
🦴 Anatomy
🫁 Physiology
💊 Pharmacology
🔬 Pathology
🦠 Microbiology
🩸 Diabetes
❤️ Hypertension
🧠 Migraine
🩸 Thrombosis
🧠 Stroke
❤️ ECG
🔥 Inflammation
💊 Adrenergic Drugs
💊 Cholinergic Drugs
⚕️ Drug Interactions

Use the Search Topics box to find more.
`;

}


/* ================================
   CHAT
================================ */

function sendAI(){

    const input =
    document.getElementById("chatInput");

    const question =
    input.value.trim();


    if(!question){
        return;
    }


    addMessage(
        question,
        "user-message"
    );


    input.value="";


    setTimeout(()=>{

        const answer =
        getAIReply(question);


        addMessage(
            answer,
            "ai-message"
        );

    },500);

}


/* ================================
   ADD MESSAGE
================================ */

function addMessage(text,type){

    const chat =
    document.getElementById("chatArea");


    const message =
    document.createElement("div");


    message.className =
    "message "+type;


    message.textContent =
    text;


    chat.appendChild(message);


    chat.scrollTop =
    chat.scrollHeight;

}


/* ================================
   ENTER
================================ */

function handleEnter(event){

    if(
        event.key==="Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendAI();

    }

}


/* ================================
   CLEAR CHAT
================================ */

function clearChat(){

    document.getElementById("chatArea")
    .innerHTML=`
    <div class="message ai-message">
    👋 Chat cleared.

    Ask me about a MedAcademy topic.
    </div>
    `;

}


/* ================================
   PROMPT
================================ */

function usePrompt(text){

    const input =
    document.getElementById("chatInput");

    input.value=text;

    input.focus();

}


/* ================================
   ASK QUESTION
================================ */

function answerStudentQuestion(){

    const input =
    document.getElementById("studentQuestion");

    const question =
    input.value.trim();


    const box =
    document.getElementById("answerBox");

    const answer =
    document.getElementById("answerText");


    if(!question){

        box.style.display="block";

        answer.textContent=
        "Please enter your question.";

        return;

    }


    box.style.display="block";


    answer.textContent=
    "🤖 Thinking...";


    setTimeout(()=>{

        answer.textContent =
        getAIReply(question);

    },500);

}


/* ================================
   SEARCH TOPICS
================================ */

function searchTopics(){

    const input =
    document.getElementById("searchBox")
    .value
    .toLowerCase()
    .trim();


    const results =
    document.getElementById("searchResults");


    results.innerHTML="";


    if(!input){
        return;
    }


    const matches =
    topics.filter(topic =>
        topic
        .toLowerCase()
        .includes(input)
    );


    if(matches.length===0){

        results.innerHTML=`
        <div class="search-result">
        ❌ No topic found.
        </div>
        `;

        return;

    }


    matches.forEach(topic=>{

        const div =
        document.createElement("div");

        div.className=
        "search-result";

        div.innerHTML=
        `📖 <strong>${topic}</strong>
        <br>
        <button
        onclick="askTopic('${topic.replace(/'/g,"\\'")}')"
        style="
        margin-top:8px;
        padding:8px 14px;
        border:0;
        border-radius:7px;
        background:#0d6efd;
        color:white;
        cursor:pointer;
        ">
        Ask AI →
        </button>`;

        results.appendChild(div);

    });

}


/* ================================
   ASK TOPIC FROM SEARCH
================================ */

function askTopic(topic){

    document
    .getElementById("chatInput")
    .value =
    "Explain "+topic;

    document
    .getElementById("ai")
    .scrollIntoView({
        behavior:"smooth"
    });

    setTimeout(()=>{
        sendAI();
    },500);

}


/* ================================
   SUGGESTIONS
================================ */

function showSuggestions(){

    const input =
    document
    .getElementById("suggestionInput")
    .value
    .toLowerCase()
    .trim();


    const list =
    document
    .getElementById("suggestionList");


    list.innerHTML="";


    const popular=[
        "Heart",
        "Brain",
        "Kidney",
        "Diabetes",
        "Migraine",
        "Anatomy",
        "Pharmacology",
        "Pathology"
    ];


    const matches =
    input
    ?
    topics
    .filter(topic =>
        topic
        .toLowerCase()
        .includes(input)
    )
    .slice(0,10)
    :
    popular;


    matches.forEach(topic=>{

        const item =
        document.createElement("div");

        item.className=
        "suggestion";

        item.textContent=
        "🔎 "+topic;


        item.onclick=()=>{

            document
            .getElementById("searchBox")
            .value=topic;

            searchTopics();

            document
            .querySelector(".search-area")
            .scrollIntoView({
                behavior:"smooth"
            });

        };


        list.appendChild(item);

    });

}


/* ================================
   START
================================ */

showSuggestions();

</script>
