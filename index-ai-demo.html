<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MedAcademy AI Demo</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f9fb;color:#18323a}
    header{background:#087f8c;color:#fff;padding:28px 7%}
    main{max-width:900px;margin:40px auto;padding:0 20px}
    .card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 25px #0001}
    h1{margin-top:0}
  </style>
</head>
<body>
  <header><h1>🩺 MedAcademy</h1><p>AI-powered medical learning assistant</p></header>
  <main>
    <div class="card">
      <h2>Welcome to MedAcademy AI</h2>
      <p>Click the AI button below and ask a question in English, Urdu or Roman Urdu.</p>
      <p><b>Examples:</b> What is brachial plexus? / Migraine kya hota hai? / Explain ECG / What is pharmacology?</p>
    </div>
  </main>
  <script src="ai-widget.js"></script>
</body>
</html>
